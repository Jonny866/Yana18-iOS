name: Build and Sign iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Sign IPA for iPhone (ESign, Scarlet, GBox, TrollStore)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg and xcodegen
        run: brew install ffmpeg xcodegen

      - name: Convert video to audio-only m4a
        run: |
          set -e
          echo "Converting barbariki_birthday.mp4 (20MB video) to audio-only m4a..."
          ffmpeg -i Resources/music/barbariki_birthday.mp4 \
            -vn -acodec aac -b:a 128k \
            Resources/music/barbariki_birthday.m4a
          rm -f Resources/music/barbariki_birthday.mp4
          echo "Audio conversion complete:"
          ls -lh Resources/music/

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = [0-9]*/objectVersion = 60/g' App.xcodeproj/project.pbxproj
          echo "Verified objectVersion:"
          grep "objectVersion" App.xcodeproj/project.pbxproj

      - name: Build Xcode App Binary
        run: |
          set -e
          set -o pipefail
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee xcodebuild.log || {
              echo "=== XCODEBUILD FAILED. LAST 50 LINES: ==="
              tail -n 50 xcodebuild.log
              exit 1
            }

      - name: Package IPA
        run: |
          set -e
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/Build/Products -name "App.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "Error: App.app not found!"
            find build/Build/Products -maxdepth 3 -ls || true
            exit 1
          fi
          echo "App bundle: $APP_PATH"
          ls -lh "$APP_PATH"

          mkdir -p output/Payload
          cp -R "$APP_PATH" output/Payload/
          cd output
          zip -r -y Yana18.ipa Payload
          echo "IPA size:"
          ls -lh Yana18.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yana18-iOS-IPA
          path: output/Yana18.ipa
          retention-days: 30
