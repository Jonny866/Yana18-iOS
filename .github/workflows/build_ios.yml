name: Build and Sign iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Sign IPA for iPhone (ESign, Scarlet, GBox, TrollStore)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Xcode App Binary
        run: |
          set -e
          set -o pipefail
          xcodebuild -project Yana18.xcodeproj \
            -scheme Yana18 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee xcodebuild.log || {
              echo "=== XCODEBUILD FAILED. LAST 50 LINES OF LOG: ==="
              tail -n 50 xcodebuild.log
              exit 1
            }

      - name: Package Clean IPA for iPhone (ESign, Scarlet, GBox, TrollStore)
        run: |
          set -e
          echo "Looking for Yana18.app bundle in build directory..."
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "Yana18.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/Build/Products -name "Yana18.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "Error: App bundle was not found!"
            find build/Build/Products -maxdepth 3 -ls || true
            exit 1
          fi
          echo "Found compiled app bundle at: $APP_PATH"

          if [ ! -f "$APP_PATH/Yana18" ]; then
            echo "Error: Executable binary Yana18 is missing from $APP_PATH!"
            ls -la "$APP_PATH"
            exit 1
          fi
          echo "Executable binary found! Details:"
          file "$APP_PATH/Yana18"
          ls -lh "$APP_PATH/Yana18"

          mkdir -p output/Payload
          cp -R "$APP_PATH" output/Payload/
          cd output
          zip -r -y Yana18.ipa Payload
          echo "Successfully created Yana18.ipa"
          ls -lh Yana18.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yana18-iOS-IPA
          path: output/Yana18.ipa
          retention-days: 30
