name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build & Archive iOS App
        run: |
          xcodebuild -project Yana18.xcodeproj \
            -scheme Yana18 \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            archive -archivePath build/Yana18.xcarchive

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Yana18.xcarchive/Products/Applications/*.app build/Payload/
          codesign --force --deep --sign - build/Payload/*.app
          cp Resources/AppIcon-1024.png build/iTunesArtwork@2x
          cp Resources/AppIcon-512.png build/iTunesArtwork
          cd build
          zip -r -y Yana18.ipa Payload iTunesArtwork iTunesArtwork@2x

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yana18-iOS-IPA
          path: build/Yana18.ipa
          retention-days: 30
