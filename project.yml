name: Yana18
options:
  bundleIdPrefix: com.yana18
  createIntermediateGroups: true
targets:
  Yana18:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yana18.gift
      PRODUCT_NAME: "Яна · 18"
      INFOPLIST_FILE: Resources/Info.plist
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      ENABLE_BITCODE: NO
      GENERATE_INFOPLIST_FILE: NO
      SWIFT_VERSION: "5.9"
